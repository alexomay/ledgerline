name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Aplicación web
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx ng build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas (PostgreSQL embebido y Kafka con Testcontainers)
        run: ./mvnw -B verify

      - name: Reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Levantar todo con Docker Compose
        run: docker compose up -d --build
      - name: Probar que responde
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:8080/actuator/health && break
            sleep 2
          done
          curl -sf localhost:8080/actuator/health
          curl -sf localhost:8080/api/demo
          curl -sf -o /dev/null localhost:8080/
      - name: Registros
        if: failure()
        run: docker compose logs app
